[package]
name = "rust-dap-rp"
version = "0.3.0"
authors = ["Kenta IDA <fuga@fugafuga.org>"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["rp2040"]
rp2040 = [
    "dep:rp2040-boot2",
    "dep:rp2040-hal",
    "dep:pio02",
    "dep:heapless",
    "dep:bitvec",
]
rp2350 = ["dep:rp235x-hal", "dep:pio03", "dep:bitvec"]
bitbang = [] # Use bit-banging transports instead of PIO
set_clock = [] # Enable SWJ clock configuration for PIO. Otherwise, SWCLK is fixed to 15.625[MHz].
ram-exec = ["rp2040"] # Execute-in-SRAM support (linker script only; pick boot2-ram-memcpy or provide your own boot2)
# Transitional: library-provided boot2 blocks. Boards should define their own
# BOOT2_FIRMWARE static instead (the right block depends on the flash chip).
boot2-w25q080 = ["rp2040"]
boot2-ram-memcpy = ["rp2040"]
defmt = ["dep:defmt"]

[dependencies]
rust-dap = { path = "../rust-dap" }
rp2040-boot2 = { version = "0.2", optional = true }
rp2040-hal = { version = "0.10", optional = true }
rp235x-hal = { version = "0.4", optional = true }
pio02 = { package = "pio", version = "0.2", optional = true }
pio03 = { package = "pio", version = "0.3", optional = true }
panic-halt = "0.2"
cortex-m = "0.7"

usb-device = { version = "0.3", features = ["control-buffer-256"] }
usbd-serial = "0.2"
heapless = { version = "0.7", optional = true }
embedded-hal = "1.0"
embedded-hal-nb = "1.0"
fugit = "0.3"
defmt = { version = "0.3", optional = true }
bitvec = { version = "1.1", default-features = false, optional = true }
